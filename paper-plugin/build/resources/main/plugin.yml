name: NakedAndAfraid
version: 2.0.4
main: net.nakedandafraid.paper.NakedAndAfraidPlugin
description: Server-authoritative moderation, message, and Hardcore-safe gameplay control.
api-version: "1.21"
author: NakedAndAfraid
commands:
  nakedandafraid:
    description: Control Naked And Afraid features.
    usage: /nakedandafraid <gui|status|reload|chat|tab|death|join|quit|advancement> [on|off]
    aliases:
      - "na"
    permission: nakedandafraid.command
permissions:
  nakedandafraid.command:
    description: Allows the Naked And Afraid root command to appear and be used.
    default: op
  nakedandafraid.all:
    description: Allows every Naked And Afraid command and GUI control.
    default: op
    children:
      nakedandafraid.command: true
      nakedandafraid.gui: true
      nakedandafraid.settings: true
      nakedandafraid.command.status: true
      nakedandafraid.command.reload: true
      nakedandafraid.command.chat: true
      nakedandafraid.command.tab: true
      nakedandafraid.command.death: true
      nakedandafraid.command.join: true
      nakedandafraid.command.quit: true
      nakedandafraid.command.advancement: true
      nakedandafraid.command.armor-damage: true
      nakedandafraid.command.death-sound: true
      nakedandafraid.command.armor-damage-amount: true
  nakedandafraid.gui:
    description: Allows opening the Naked And Afraid dialog GUI. Visible controls still require their own permissions.
    default: op
    children:
      nakedandafraid.command: true
  nakedandafraid.settings:
    description: Allows access to every option in the Settings GUI page.
    default: op
    children:
      nakedandafraid.gui: true
  nakedandafraid.command.status:
    description: Allows viewing Naked And Afraid status.
    default: op
    children:
      nakedandafraid.command: true
  nakedandafraid.command.reload:
    description: Allows reloading Naked And Afraid configuration.
    default: op
    children:
      nakedandafraid.command: true
  nakedandafraid.command.chat:
    description: Allows toggling public chat.
    default: op
    children:
      nakedandafraid.command: true
  nakedandafraid.command.tab:
    description: Allows toggling tab list access and spectator tab access in the GUI.
    default: op
    children:
      nakedandafraid.command: true
  nakedandafraid.command.death:
    description: Allows toggling death messages.
    default: op
    children:
      nakedandafraid.command: true
  nakedandafraid.command.join:
    description: Allows toggling join messages.
    default: op
    children:
      nakedandafraid.command: true
  nakedandafraid.command.quit:
    description: Allows toggling quit messages.
    default: op
    children:
      nakedandafraid.command: true
  nakedandafraid.command.advancement:
    description: Allows toggling advancement messages.
    default: op
    children:
      nakedandafraid.command: true
  nakedandafraid.command.armor-damage:
    description: Allows toggling armor damage and armor damage item options in the GUI.
    default: op
  nakedandafraid.command.armor-damage-amount:
    description: Allows changing armor damage hearts per second in the GUI.
    default: op
  nakedandafraid.command.death-sound:
    description: Allows toggling automatic death sounds in the GUI.
    default: op
