# Message/tab feature values use normal on/off semantics:
# true = allowed/visible; false = blocked/suppressed.
# Gameplay effect feature values are active when true.
features:
  tab-list: true
  public-chat: true
  death-messages: true
  join-messages: true
  quit-messages: true
  advancement-messages: true
  armor-damage: false
  death-sound: false

mechanics:
  # Allows spectators to see the full player list while tab-list is disabled for other players.
  spectators-can-see-tab-list: false
  # Hearts per second, 0 to 5 in 0.5-step increments.
  armor-damage-hearts-per-second: 1.0
  armor-damage-items:
    mob-heads: false
    carved-pumpkins: false
    elytras: false

messages:
  prefix: "<gray>[<aqua>Naked And Afraid</aqua>]</gray>"
  chat-blocked: "<red>Public chat is currently disabled.</red>"
